<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; padding: 15px; direction: rtl; margin: 0; color: #0f172a; }
        .card { background: white; max-width: 550px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        /* رأس الصفحة والمدرسة والمدرس */
        .school-header { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; }
        .school-name { font-size: 14px; color: #64748b; font-weight: 600; }
        .teacher-name { font-size: 13px; color: #94a3b8; margin-top: 2px; }

        h2 { color: #1e3a8a; text-align: center; margin-top: 0; font-size: 19px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 15px; }

        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }

        .svg-container { width: 100%; max-width: 340px; margin: 10px auto; display: block; }
        
        .question-box { background: #f8fafc; border-right: 4px solid #2563eb; padding: 12px; margin-top: 15px; border-radius: 6px; }
        .option-label { display: flex; align-items: center; margin: 8px 0; cursor: pointer; font-size: 13px; background: white; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; transition: background 0.2s; }
        .option-label:hover { background: #f1f5f9; }
        .option-label input { margin-left: 10px; }

        .btn { display: block; width: 100%; background: #2563eb; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; }
        .btn:hover { background: #1d4ed8; }

        .feedback { margin-top: 15px; padding: 11px; border-radius: 6px; font-weight: bold; display: none; text-align: center; font-size: 13px; }
        .feedback.correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .feedback.incorrect { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .result-screen { text-align: center; display: none; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; background: #1e3a8a; color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin: 20px auto; }
    </style>
</head>

<div class="card">

    </div>

    <h2>اكتشف الأخطاء في المخططات الانسيابية 🔍</h2>
    <div class="subtitle" id="stepCounter">السؤال 1 من 10</div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="quizContent">
        <div id="svgContainer"></div>

        <div class="question-box">
            <strong id="questionText" style="font-size: 14px;">جاري تحميل السؤال...</strong>
            <div id="optionsContainer" style="margin-top: 8px;"></div>
        </div>

        <div id="feedback" class="feedback"></div>

        <button id="actionBtn" class="btn" onclick="checkAnswer()">تأكيد الإجابة</button>
    </div>

    <div id="resultScreen" class="result-screen">
        <h3>أحسنت! أكملت بنك الأسئلة بنجاح</h3>
        <p>درجتك النهائية في اكتشاف الأخطاء:</p>
        <div class="score-circle" id="scoreText">0/10</div>

    let currentQ = 0;
    let score = 0;
    let selectedOption = null;

    function loadQuestion() {
        selectedOption = null;
        const q = quizData[currentQ];
        document.getElementById("stepCounter").innerText = `السؤال ${currentQ + 1} من ${quizData.length}`;
        document.getElementById("progressFill").style.width = `${((currentQ) / quizData.length) * 100}%`;
        
        document.getElementById("svgContainer").innerHTML = q.svg;
        document.getElementById("questionText").innerText = q.question;
        
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        
        q.options.forEach((opt, idx) => {
            optionsDiv.innerHTML += `
                <label class="option-label">
                    <input type="radio" name="quizOpt" value="${idx}" onclick="selectedOption = ${idx}">
                    ${opt}
                </label>
            `;
        });

        const fb = document.getElementById("feedback");
        fb.style.display = "none";
        fb.className = "feedback";
        
        const btn = document.getElementById("actionBtn");
        btn.innerText = "تأكيد الإجابة";
        btn.onclick = checkAnswer;
    }

    function checkAnswer() {
        if (selectedOption === null) {
            alert("يرجى اختيار إجابة أولاً قبل التأكيد!");
            return;
        }

        const q = quizData[currentQ];
        const fb = document.getElementById("feedback");
        fb.style.display = "block";

        if (selectedOption === q.correct) {
            score++;
            fb.className = "feedback correct";
            fb.innerHTML = `✅ ${q.explain}`;
        } else {
            fb.className = "feedback incorrect";
            fb.innerHTML = `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${q.options[q.correct]})`;
        }

        const btn = document.getElementById("actionBtn");
        if (currentQ < quizData.length - 1) {
            btn.innerText = "السؤال التالي ➔";
            btn.onclick = nextQuestion;
        } else {
            btn.innerText = "عرض النتيجة النهائية 🏆";
            btn.onclick = showResults;
        }
    }

    function nextQuestion() {
        currentQ++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById("quizContent").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("stepCounter").innerText = "تم اكتمال الاختبار";
        document.getElementById("scoreText").innerText = `${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentQ = 0;
        score = 0;
        document.getElementById("quizContent").style.display = "block";
        document.getElementById("resultScreen").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

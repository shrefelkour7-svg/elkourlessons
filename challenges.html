            .catch(err => {
                console.error(err);
                studentsList = ["محمد أحمد الفيتوري", "علي خالد المنفي", "عمر سالم العبيدي"];
                populateStudentSelect();
            });
    };

    function parseStudentsCSV(csvText) {
        const lines = csvText.trim().split('\n');
        studentsList = [];
        lines.forEach(line => {
            if (!line.trim()) return;
            const columns = line.split(',');
            const name = columns[0] ? columns[0].trim().replace(/["\r]/g, '') : '';
            if (name) {
                studentsList.push(name);
            }
        });
        populateStudentSelect();
    }

    function populateStudentSelect() {
        const select = document.getElementById('studentSelect');
        select.innerHTML = '<option value="">-- اختر اسم الطالب --</option>';
        studentsList.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            select.appendChild(opt);
        });
    }

    function getRandomQuestions(arr, count) {
        const shuffled = [...arr].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function startQuiz() {
        selectedStudent = document.getElementById('studentSelect').value;
        selectedTopic = document.getElementById('topicSelect').value;

        if (!selectedStudent || !selectedTopic) {
            alert('الرجاء اختيار اسمك وموضوع التحدي أولاً!');
            return;
        }

        const topicQuestions = quizData[selectedTopic] || quizData["خطوات حل المشكلة"];
        activeQuestions = getRandomQuestions(topicQuestions, 10);

        proceedToQuiz();
    }

    function proceedToQuiz() {
        document.getElementById('stepLogin').classList.add('hidden');
        document.getElementById('stepQuiz').classList.remove('hidden');
        document.getElementById('quizTopicTitle').textContent = selectedTopic;

        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        activeQuestions.forEach((item, index) => {
            let html = `<div style="margin-bottom: 20px; background: #fafafa; padding: 15px; border-radius: 5px;">`;
            html += `<p><strong>${index + 1}. ${item.q}</strong></p>`;
            item.options.forEach((opt, optIdx) => {
                html += `<label><input type="radio" name="q${index}" value="${optIdx}"> ${opt}</label><br>`;
            });
            html += `</div>`;
            container.innerHTML += html;
        });
    }

    function submitQuiz() {
        let score = 0;

        for (let i = 0; i < activeQuestions.length; i++) {
            const radios = document.getElementsByName(`q${i}`);
            let answered = false;
            for (const r of radios) {
                if (r.checked) {
                    answered = true;
                    if (parseInt(r.value) === activeQuestions[i].correct) {
                        score += 3;
                    }
                }
            }
            if (!answered) {
                alert(`الرجاء الإجابة على السؤال رقم ${i + 1}`);
                return;
            }
        }

        const maxScore = activeQuestions.length * 3;
        const freshResultsUrl = RESULTS_API_URL + '?t=' + new Date().getTime();

        fetch(freshResultsUrl, {
            headers: {
                'Authorization': 'token ' + GH_TOKEN,
                'Accept': 'application/vnd.github.v3+json'
            }
        })
        .then(res => res.json())
        .then(fileData => {
            let existingCSV = '';
            let fileSha = '';

            // التحقق الذكي الآمن: جلب الـ SHA فقط إذا كان الملف موجوداً وغير فارغ
            if (fileData && fileData.sha) {
                fileSha = fileData.sha;
            }

            if (fileData && fileData.content) {
                const binaryString = atob(fileData.content);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decoder = new TextDecoder('utf-8');
                existingCSV = decoder.decode(bytes);
            }

            const dateStr = new Date().toISOString().split('T')[0];
            const newRow = `${selectedStudent},${selectedTopic},${score}/${maxScore},نجاح,${dateStr}`;
            const updatedCSV = existingCSV ? existingCSV.trim() + '\n' + newRow : newRow;

            const utf8Encoder = new TextEncoder();
            const utf8Bytes = utf8Encoder.encode(updatedCSV);
            let binaryStringOut = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                binaryStringOut += String.fromCharCode(utf8Bytes[i]);
            }
            const encodedContent = btoa(binaryStringOut);

            // بناء الطلب بمرونة تامة لتفادي أخطاء جيت هب عند تفريغ الملف
            const requestBody = {
                message: `Add result for ${selectedStudent} - ${selectedTopic}`,
                content: encodedContent
            };
            if (fileSha) {
                requestBody.sha = fileSha;
            }

            return fetch(RESULTS_API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': 'token ' + GH_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });
        })
        .then(res => {
            if (!res.ok) throw new Error('فشل التحديث في جيت هب');
            return res.json();
        })
        .then(() => {
            document.getElementById('stepQuiz').classList.add('hidden');
            document.getElementById('stepResult').classList.remove('hidden');
            document.getElementById('resultText').textContent = `الطالب: ${selectedStudent} | الموضوع: ${selectedTopic} | النتيجة: ${score} من ${maxScore}`;
        })
        .catch(err => {
            console.error(err);
            alert('حدث خطأ أثناء حفظ النتيجة: ' + err.message);
        });
    }
</script>
